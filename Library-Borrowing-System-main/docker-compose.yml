version: "3.8"

services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:8
    container_name: library-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: nacon7_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init_books.sql:/docker-entrypoint-initdb.d/01-init-books.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: library-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== r-nacos 注册/配置中心 ====================
  r-nacos:
    image: qingpan/rnacos:stable
    container_name: library-nacos
    restart: always
    ports:
      - "8848:8848"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==================== Java 后端 ====================
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: library-backend
    restart: always
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/nacon7_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_SERVER_ADDR: r-nacos:8848
      NACOS_NAMESPACE: public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      r-nacos:
        condition: service_started

  # ==================== Nginx 前端 ====================
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: library-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:

version: "3.8"

services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:8
    container_name: library-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: nacon7_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: >
      --innodb-buffer-pool-size=256M
      --innodb-log-buffer-size=16M
      --max-connections=20
      --innodb-flush-log-at-trx-commit=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: library-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

  # ==================== Java 后端 ====================
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: library-backend
    restart: always
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/nacon7_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ==================== Nginx 前端 ====================
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: library-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  mysql-data:
